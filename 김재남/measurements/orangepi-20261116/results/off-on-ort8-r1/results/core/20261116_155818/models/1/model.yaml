model:
  name: yolov8n
  path: /home/orangepi/workspace/model-bank/tracking_server/models/detect/yolov8/yolov8n_nms_640x640.dxnn
camera_input:
  opencv_type: CV_16UC1
  width: 640
  height: 480
  clip_min: 0
  clip_max: 65535
  channel_mode: replicate_gray_to_rgb
input:
  width: 640
  height: 640
preprocess:
  type: lwir_letterbox
  resize: letterbox
  normalize: false
  pad_value: 114
postprocess:
  type: yolov8
  output_format: auto
  split_output_levels: 3
  split_regression_bins: 16
  split_class_score_activation: sigmoid
  nms_mode: enabled
  class_agnostic_nms: true
  confidence_threshold: 0.01
  nms_threshold: 0.45
  num_classes: 16
  class_names:
  - person
  - bicycle
  - car
  - motorcycle
  - airplane
  - bus
  - train
  - truck
  - boat
  - traffic light
  - fire hydrant
  - stop sign
  - parking meter
  - bench
  - bird
  - cat
