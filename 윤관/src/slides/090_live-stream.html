<article class="content-slide" id="live-stream"><header><h1>운영 화면 영상 지연</h1></header>
<div class="research-steps"><div>기존 현상<small>약 5Mbps 업링크에서<br>화면에 이전 프레임이 쌓임</small></div><div>전송 대기 확인<small>이전 이미지가 나간 뒤<br>가장 최신 프레임 전송</small></div><div>전송량 조정<small>960×720 → 640×480<br>JPEG 80 → 70<br>느린 연결 320×240 추가</small></div><div>표시 순서 개선<small>이미지 직후 경계를 보내<br>브라우저의 표시 대기 감소</small></div></div>
<p class="recent-note">구현과 개선 의도를 기록함. 수정 후 실제 지연 감소량과 장시간 현장 성능은 별도 측정이 필요하다.</p></article>
