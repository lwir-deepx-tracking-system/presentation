<article class="content-slide" id="fasttrack-method"><header><h1>FastTrackTr 학습 조건</h1></header>
<div class="research-steps" style="margin-top:48px"><div>초기 모델<small>DanceTrack 흑백 6 epoch<br>번호 손실과 다중 크기 수정</small></div><div>열화상 이어 학습<small>TMOT 학습 24편 +<br>DanceTrack 약 30%</small></div><div>학습 설정<small>3 epoch · 배치 4 · bf16<br>학습률 5e−5 · 백본은 0.1배</small></div><div>안정화·평가<small>1 epoch 워밍업<br>2 epoch 뒤 학습률 0.1배</small></div></div>
<p class="recent-note">모델뱅크 INFO의 실제 학습 기록 기준이다. 검출과 ID 특징을 함께 학습했다. 열화상 재생 점수는 좋아졌지만 실내 일부 영상에서 나빠져 11/15 학습을 멈추고 시험용으로만 남겼다.</p></article>
