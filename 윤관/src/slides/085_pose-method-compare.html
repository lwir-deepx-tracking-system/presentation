<article class="content-slide" id="pose-method-compare"><header><h1>비교 설계와 현장 데이터</h1></header>
<div class="research-steps" style="margin-top:48px"><div>같은 출발점<small>같은 가중치·자료·에폭으로<br>실험 시작</small></div><div>하나씩 변경<small>새 가림 합성 등<br>바꾸는 조건만 비교</small></div><div>사람 찾기 평가<small>실내 녹화·가림 정도별 검출과<br>공개 데이터 성능 함께 확인</small></div><div>3단계 수행<small>우리 카메라 영상 라벨 검수<br>1차 후보 학습·평가</small></div></div>
<p class="recent-note">자체 카메라 1차 후보는 미리 정한 평가 기준을 통과하지 못했다. 새 실내 자료를 더한 2차 후보는 11월 16일 기록 기준 진행 중이었다.</p></article>
